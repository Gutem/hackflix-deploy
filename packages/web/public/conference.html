<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackflix — Conference</title>
  <link rel="stylesheet" href="/css/global.css?v=1785940955">
  <script src="/js/htmx.min.js?v=1785940955"></script>
  <script src="/js/hackflix.js?v=1785940955"></script>
  <script src="/js/i18n.js?v=1785940955"></script>
</head>
<body hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML">
<header class="site-header">
  <a href="/" class="site-logo">HACKFLIX</a>
  <nav class="site-nav">
    <a href="/">Início</a>
    <a href="/conferences/">Conferências</a>
    <a href="/documentaries/">Documentários</a>
    <a href="/topic/">Tópicos</a>
    <a href="/search/">Buscar</a>
    <a href="/profile/">Perfil</a>
  </nav>
</header>

<main id="main" class="main main-detail">
  <div id="detail-content" class="loading">Carregando...</div>
<script>
(function () {
  var H = window.Hackflix;
  var params = new URLSearchParams(window.location.search);
  var slug = params.get("slug");
  var detailEl = document.getElementById("detail-content");

  function renderCard(item) {
    return H.renderCard(item, {});
  }

  async function load() {
    if (!slug) {
      detailEl.innerHTML = '<div class="error"><p>Nenhuma conferência especificada</p><a href="/conferences/" class="btn">\u2190 Voltar</a></div>';
      return;
    }

    try {
      var auth = await H.authenticate().catch(function () { return null; });
      if (!auth) return;
      var res = await fetch("/api/conference/" + encodeURIComponent(slug), { credentials: "include" });
      if (res.status === 401) { window.location.href = "/login/"; return; }
      var data = await res.json();

      if (!data || !data.items || !data.items.length) {
        detailEl.innerHTML = '<div class="empty"><h2>Nenhuma palestra encontrada</h2><a href="/conferences/" class="btn">\u2190 Voltar às Conferências</a></div>';
        return;
      }

      var years = {};
      data.items.forEach(function (item) {
        var y = item.year || "Unknown";
        if (!years[y]) years[y] = [];
        years[y].push(item);
      });

      var sortedYears = Object.keys(years).sort().reverse();
      var total = data.items.length;

      var conf = data.conference || {};
      var logoHtml = conf.logo ? '<img src="' + H.escapeHtml(conf.logo) + '" class="card-logo" style="float:right;margin-left:1.5rem;margin-bottom:0.5rem;max-height:60px;max-width:120px" onerror="this.style.display=\'none\'">' : '';
      var descHtml = conf.description ? '<p style="color:var(--color-text-secondary);padding-right:var(--content-padding-x);max-width:600px;margin-top:0.5rem">' + H.escapeHtml(conf.description) + '</p>' : '';
      var siteHtml = conf.website ? '<a href="' + H.escapeHtml(conf.website) + '" target="_blank" rel="noopener" style="color:var(--color-accent);font-size:0.85rem">' + H.escapeHtml(conf.website) + '</a>' : '';
      var html = '<a href="/conferences/" class="back-btn">\u2190 Voltar \u00e0s Confer\u00eancias</a>' +
        '<div class="conf-hero">' + logoHtml + '<h1>' + H.escapeHtml(data.name || conf.name || slug) + '<span class="heading-count">' + total + ' palestras</span></h1>' + descHtml + siteHtml + '</div>';

      sortedYears.forEach(function (year) {
        var items = years[year];
        html += '<section style="padding:0 var(--content-padding-x);margin-bottom:2rem">' +
          '<h2 class="carousel-title">' + year + ' <span class="heading-count">' + items.length + '</span></h2>' +
          '<div class="card-grid">' +
          items.map(function (item) { return renderCard(item); }).join("") +
          '</div></section>';
      });

      detailEl.innerHTML = html;
      detailEl.classList.remove("loading");
    } catch (e) {
      detailEl.innerHTML = '<div class="error-state"><h1>Falha ao carregar</h1></div>';
    }
  }

  load();
})();
</script></main>
</body>
</html>
