<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackflix — Search</title>
  <link rel="stylesheet" href="/css/global.css?v=1785940955">
  <script src="/js/htmx.min.js?v=1785940955"></script>
  <script src="/js/hackflix.js?v=1785940955"></script>
  <script src="/js/i18n.js?v=1785940955"></script>
</head>
<body hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML">
<header class="site-header">
  <a href="/" class="site-logo">HACKFLIX</a>
  <nav class="site-nav">
    <a href="/">Início</a>
    <a href="/conferences/">Conferências</a>
    <a href="/documentaries/">Documentários</a>
    <a href="/topic/">Tópicos</a>
    <a href="/search/" class="active">Buscar</a>
    <a href="/profile/">Perfil</a>
  </nav>
</header>

<main id="main" class="main">
  <input type="text" id="search-input" class="search-input" placeholder="Buscar palestras..." autofocus>
  <div id="results"></div>
<script>
(function () {
  var H = window.Hackflix;
  var input = document.getElementById("search-input");
  var resultsEl = document.getElementById("results");
  var q = new URLSearchParams(window.location.search).get("q") || "";

  if (q) input.value = q;

  async function search(term) {
    if (!term || term.length < 2) { resultsEl.innerHTML = ""; return; }
    try { await H.authenticate(); } catch { return; }
    resultsEl.innerHTML = '<div class="loading" style="height:auto;padding:2rem">Buscando...</div>';

    try {
      var res = await fetch("/api/search?q=" + encodeURIComponent(term), { credentials: "include" });
      if (res.status === 401) { window.location.href = "/login/"; return; }
      var data = await res.json();
      var matches = data.results || data.content || data || [];

      if (!matches.length) {
        resultsEl.innerHTML = '<div class="empty" style="height:auto;padding:3rem"><h2>Nenhum resultado</h2><p>Tente palavras-chave diferentes</p></div>';
        return;
      }

      resultsEl.innerHTML = '<div class="card-grid" style="padding:0 var(--content-padding-x)">' +
        matches.map(function (m) { return H.renderCard(m); }).join("") +
        '</div>';
    } catch (e) {
      resultsEl.innerHTML = '<div class="error-state" style="height:auto;padding:2rem"><h1>Falha na busca</h1></div>';
    }
  }

  var timer;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { search(input.value.trim()); }, 300);
  });

  if (q) search(q);
})();
</script></main>
</body>
</html>
